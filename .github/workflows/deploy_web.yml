name: Deploy 2D Dungeon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gameplay and timing checks
        run: |
          node tests/full-2d.cjs
          node tests/release-2d.cjs
          node tests/normal-2d.cjs
          node tests/mobile-2d.cjs
      - name: Package versioned game
        shell: bash
        run: |
          BUILD="${GITHUB_SHA::8}"
          mkdir -p "build/web/game-$BUILD"
          cp -R web-2d/. "build/web/game-$BUILD/"
          printf '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=game-%s/"><title>Rogue Dodge</title><a href="game-%s/">Open latest game</a>' "$BUILD" "$BUILD" > build/web/index.html
          printf '{"build":"%s","url":"game-%s/"}' "$BUILD" "$BUILD" > build/web/latest.json
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
